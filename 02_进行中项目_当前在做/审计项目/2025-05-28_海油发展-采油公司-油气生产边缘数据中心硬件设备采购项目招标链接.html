    <title>查看招标文件</title>
    <!-- 重置样式 -->
    <style>
        html {
            line-height: 1.15;
            -webkit-text-size-adjust: 100%;
            background-color: rgb(248, 249, 250);
            font-family: 微软雅黑;
        }

        ul,
        li {
            padding: 0;
            margin: 0;
            list-style: none
        }

        body {
            margin: 0;
        }

        main {
            display: block;
        }

        h1 {
            font-size: 2em;
            margin: 0.67em 0;
        }

        hr {
            box-sizing: content-box;
            height: 0;
            overflow: visible;
        }

        pre {
            font-family: monospace, monospace;
            font-size: 1em;
        }

        a {
            background-color: transparent;
        }

        abbr[title] {
            border-bottom: none;
            text-decoration: underline;
            text-decoration: underline dotted;
        }

        b,
        strong {
            font-weight: bolder;
        }

        code,
        kbd,
        samp {
            font-family: monospace, monospace;
            font-size: 1em;
        }

        small {
            font-size: 80%;
        }

        sub,
        sup {
            font-size: 75%;
            line-height: 0;
            position: relative;
            vertical-align: baseline;
        }

        sub {
            bottom: -0.25em;
        }

        sup {
            top: -0.5em;
        }

        img {
            border-style: none;
        }

        button,
        input,
        optgroup,
        select,
        textarea {
            font-family: inherit;
            font-size: 100%;
            line-height: 1.15;
            margin: 0;
        }

        button,
        input {
            overflow: visible;
        }

        button,
        select {
            text-transform: none;
        }

        button,
        [type='button'],
        [type='reset'],
        [type='submit'] {
            -webkit-appearance: button;
        }

        button::-moz-focus-inner,
        [type='button']::-moz-focus-inner,
        [type='reset']::-moz-focus-inner,
        [type='submit']::-moz-focus-inner {
            border-style: none;
            padding: 0;
        }

        button:-moz-focusring,
        [type='button']:-moz-focusring,
        [type='reset']:-moz-focusring,
        [type='submit']:-moz-focusring {
            outline: 1px dotted ButtonText;
        }

        fieldset {
            padding: 0.35em 0.75em 0.625em;
        }

        legend {
            box-sizing: border-box;
            color: inherit;
            display: table;
            max-width: 100%;
            padding: 0;
            white-space: normal;
        }

        progress {
            vertical-align: baseline;
        }

        textarea {
            overflow: auto;
        }

        [type='checkbox'],
        [type='radio'] {
            box-sizing: border-box;
            padding: 0;
        }

        [type='number']::-webkit-inner-spin-button,
        [type='number']::-webkit-outer-spin-button {
            height: auto;
        }

        [type='search'] {
            -webkit-appearance: textfield;
            outline-offset: -2px;
        }

        [type='search']::-webkit-search-decoration {
            -webkit-appearance: none;
        }

        ::-webkit-file-upload-button {
            -webkit-appearance: button;
            font: inherit;
        }

        details {
            display: block;
        }

        summary {
            display: list-item;
        }

        template {
            display: none;
        }

        [hidden] {
            display: none;
        }
    </style>

    <style>
        .zl-table-box {
            display: none;
            /*height: 360px;*/
            /*overflow: auto;*/
            overflow-x: auto;
        }

        /* table */
        .zl-table-box::before {
            content: '';
            height: 1px;
            width: 100%;
            display: block;
        }

        .zl-table-box table {
            width: 100%;
            border-spacing: 0;
        }

        .zl-table-box table {
            font-size: 14px;
        }

        .zl-table-box table tr th {
            line-height: 20px;
            padding: 14px 0;
            background: rgba(0, 0, 0, 0.02);
            text-align: left;
        }

        .zl-table-box table tr td {
            line-height: 20px;
            padding: 14px 0;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            color: rgba(0, 0, 0, 0.65);
            /*min-width: 160px;*/
        }

        .zl-table-box table tr th {
            min-width: 160px;
        }

        .zl-table-box table tr th:first-child,
        .zl-table-box table tr td:first-child {
            padding-left: 16px;
            width: 60px;
        }

        .zl-table-box table tr td a {
            color: #3785EA;
            cursor: pointer;
        }

        .zl-table-box table tr td .zl-table-link {
            color: #3785EA;
        }

        .zl-table-box table tr td a:hover {
            opacity: 0.8;
        }

        .zl-table-box table tr:nth-child(even) td {
            background: #F5F7FA;
        }

SequenceNumber":"2","@psItemId":"1374784140292497409","@itemName":"财务报告","@itemStandard":"提供2022年-2024年的经审计的财务报告，如2024年财务报告未出具或未完成审计，则提供2021年-2023年经审计的财务报告。包括资产负债表、现金流量表、利润表和财务情况说明书的复印件。成立时间短于三年的投标人，应提供自成立时起的财务报表。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":2},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"3","@psItemId":"1374784140326051840","@itemName":"★交货期","@itemStandard":"具体以订单约定内容为准，如订单未明确约定，则在订单发送之日起1个月到货，最短交货期7天。投标人提供承诺书（格式自拟或参照招标文件第六章 投标文件构成-第十三款 响应承诺书（格式）），并加盖单位公章。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":3},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"4","@psItemId":"1374784140363800577","@itemName":"付款条件","@itemStandard":"按照交货批次付款。卖方在每批次实际交付货物并经买方执行方验收合格之日起，卖方向买方执行方提供有效增值税专用发票及相关支持文件，买方执行方于四十五（45）日内支付订单价款（具体见买方执行用户下达的采购订单中的要求）。投标人提供承诺书（格式自拟或参照招标文件第六章 投标文件构成-第十三款 响应承诺书（格式）），并加盖单位公章。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":4},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"5","@psItemId":"1374784140422520832","@itemName":"★质保期服务","@itemStandard":"完成建造现场设备安装调试支持后并通过质保期后进入质保期，质保期为1年。投标人提供承诺书（格式自拟或参照招标文件第六章 投标文件构成-第十三款 响应承诺书（格式）），并加盖单位公章。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":5},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"6","@psItemId":"1374784140456075265","@itemName":"★数据应用服务器&数据处理服务器&数据采集服务器","@itemStandard":"1)产品的网络接口应支持负载均衡，冗余功能； 2)产品交付最终客户使用时，可同时交付预先安装在产品存储装置中的操作系统软件。预安装的操作系统应具备来自版权所有方合法的最终用户使用许可、功能正常； 3)支持故障自主转移； 4)预装具有国产化虚拟软件（非开源架构）许可，并与服务器兼容； 5)预装工业物联网平台并实现适配； 6)具备勒索病毒防护能力，支持对承载操作系统的勒索行为监测、勒索病毒诱捕以及数据备份恢复，支持实时监测进程对文件数据的读写行为，计算读写数据的熵值变化，结合读写文件数量、文件遍历、文件篡改等行为，精准识别勒索病毒。 投标时提供产品手册或配置清单或功能截图或检测报告，证明满足上列技术参数","@isMustQualified":true,"@itemRemark":"","@psItemSequence":6},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"7","@psItemId":"1374784140493824000","@itemName":"数据应用服务器","@itemStandard":"1)CPU：核数不低于24核*2，主频不低于2.2GHz（投标时提供芯片厂家官网证明截图或提供产品手册或提供CNAS/CMA/ilac-MRA检测报告）； 2)硬盘：存储空间不低于1.92T*2 SSD（投标时提供产品手册或配置清单）； 3)内存：不低于256GB DDR4（投标时提供产品手册或配置清单）。 4)CPU、主板、操作系统信创化(投标人在投标时提供产品手册或配置清单); 5)产品符合IEC62443安全标准，提供具有ISA secure认证的第三方机构出具的相关证明材料。提供上述要求的证明材料，满足技术参数要求。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":7},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"8","@psItemId":"1374784140535767041","@itemName":"数据处理服务器","@itemStandard":"1)CPU：核数不低于24核*2，主频不低于2.4GHz（投标时提供芯片厂家官网证明截图或提供产品手册或提供CNAS/CMA/ilac-MRA检测报告）； 2)硬盘：存储空间不低于1.92T*2 SSD（投标时提供产品手册或配置清单）； 3)内存：不低于256GB DDR4（投标时提供产品手册或配置清单）； 4)产品符合IEC62443安全标准，提供具有ISA secure认证的第三方机构出具的相关证明材料。提供上述要求的证明材料，满足技术参数要求。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":8},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"9","@psItemId":"1374784140581904384","@itemName":"数据采集服务器","@itemStandard":"1)CPU：核数不低于16核*2，主频不低于2.4GHz（标时提供芯片厂家官网证明截图或提供产品手册或提供CNAS/CMA/ilac-MRA检测报告）； 2)硬盘：存储空间不低于1.92T*2 SSD（投标时提供产品手册或配置清单）； 3)内存：不低于256GB DDR4（投标时提供产品手册或配置清单）； 4)设备品牌信创化，可支撑windows环境下单机应用软件正常运行（投标时提供产品手册或配置清单）； 5)产品符合IEC62443安全标准，具有ISA secure认证的第三方机构出具的相关证明材料。提供上述要求的证明材料，满足技术参数要求。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":9},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"10","@psItemId":"1374784140615458817","@itemName":"★磁盘阵列（1）","@itemStandard":"1)产品应至少支持块存储、对象存储、文件存储功能中的一种,应具有日志与统计报表、操作管理功能。\n2)日志与统计报表应具有下列功能:日志功能:日志记录必须完整可靠,至少包括时间、事件内容等信息。\n3)容错：支持raid；\n4)具备日志记录功能。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":10},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"11","@psItemId":"1374784140682567680","@itemName":"磁盘阵列（2）","@itemStandard":"1)缓存：不低于64G；\n2)接口：不低于8个千兆接口；\n3)存储：存储空间不低于2.4T*6；\n4)电源：双电源。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":11},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"12","@psItemId":"1374784140753870849","@itemName":"★交换机（1）","@itemStandard":"1)以太网交换机应至少拥有两个以太网接口；\n2)运行维护功能是指通过控制台等方式实现系统支持机制，包括存储/上载配置、诊断、升级、状态报告、异常情况报告及控制等。交换机应实现运行维护功能。\n3)电源：双电源；\n4)具备运行维护功能。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":12},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"13","@psItemId":"1374784140795813888","@itemName":"交换机（2）","@itemStandard":"1)机型：机架式，不超过1U；\n2)接口：不低于48个10/100/1000BASE-T以太网端口，4个千兆/万兆SFP，不低于2个万兆多模模块。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":13},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"14","@psItemId":"1374784140841951233","@itemName":"★堡垒机（1）","@itemStandard":"1)产品应提供统一的身份鉴别功能，实现运维用户的单点登录，运维用户仅需经过产品的身份鉴别后，即可访问授权范围内的资产（投标人在投标时提供产品手册或配置清单或功能截图）；\n2)若产品采用网络远程方式管理，应保证管理数据保密传输（投标人在投标时提供产品手册或配置清单或功能截图）；\n3)系统内置SSL VPN模块功能，支持远程用户安全接入, SSL VPN用户名与密码策略系统完全一致，并支持配置、VPN传输协议、端口、虚拟地址段及VPN路由（投标人在投标时提供产品手册或配置清单或功能截图）；\n4)内置常见高风险指令集并可在线对内置高风险命令集进行维护（投标人在投标时提供产品手册或配置清单或功能截图）；\n5)支持对B/S(HTTP/HTTPS)、C/S及数据库客户端程序进行集中管理及应用分发，支持系统内置应用发布服务器，应用发布服务器支持Windows和Linux操作系统（投标人在投标时提供产品手册或配置清单或功能截图）；\n6)具备国家网络与信息系统安全产品质量监督检验中心《信息技术产品安全测试证书》（投标人在投标时提供产品的《信息技术产品安全测试证书》）。提供上述要求的证明材料，满足技术参数要求。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":14},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"15","@psItemId":"1374784140888088576","@itemName":"堡垒机（2）","@itemStandard":"1)标准1U机架式，单电源，不少于6个千兆电口，1个Console口，2个USB接口，内存≥16G，硬盘≥2T；不少于2个扩展槽；支持图形并发≥50、字符并发≥100；含50个可管理设备数；\n2)具备提供对网络设备、操作系统、数据库的身份认证、操作授权、操作管理、操作审计功能；\n3)具备统一身份鉴别与单点登录功能，为用户提供操作员、安全员、审计员等不同权限的管理角色，用户可通过访问堡垒机，免登录跳转至具备访问授权权限的网络安全设备；\n4)若产品采用网络远程方式管理，应保证管理数据保密传输。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":15},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"16","@psItemId":"1374784140921643009","@itemName":"★光闸（1）","@itemStandard":"1)网络隔离产品具体要求包括访问控制、抗攻击、安全管理、标识和鉴别、审计、域隔离、容错、数据完整性和密码支持,网络单向导人产品具体要求包括访问控制、抗攻击、安全管理、标识和鉴别、审计、域隔离、配置数据保护和运行状态监测（投标人在投标时提供产品手册或配置清单或功能截图）；\n2)网络隔离产品安全功能应使授权管理员能存档、删除和清空审计记录（投标人在投标时提供产品手册或配置清单或功能截图）；\n3)具备数据单向采集功能：提供工控网络数据采集与单向导出至生产网/办公网功能，具备OPC DA、OPC UA、Modbus TCP等多种主流协议数据采集、转发能力（投标人在投标时提供产品手册或配置清单或功能截图）  DA/UA、MQTT、IEC 104；\n4)数据服务协议：modbus tcp、modbus rtu、opc DA/UA、webservise、comserver、Rest API；\n5)支持windows系统和Linux系统；\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":26},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"27","@psItemId":"1374784141433348096","@itemName":"工业实时库-150000点","@itemStandard":"1)点位授权：150000点；\n2)Web页面授权：10并发；\n3)数据采集协议：modbus tcp、modbus rtu、opc DA/UA、MQTT、IEC 104；\n4)数据服务协议：modbus tcp、modbus rtu、opc DA/UA、webservise、comserver、Rest API；\n5)支持windows系统和Linux系统；\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":27},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"28","@psItemId":"1374784141496262657","@itemName":"★路由器（1）","@itemStandard":"1)路由器应执行自主访问控制策略，通过管理员属性表，控制不同管理员对路由器的配置数据和其他数据的查看、修改，以及对路由器上程序的执行，阻止非授权人员进行上述活动。\n2)路由器应支持 SNMP V3。可通过设置 SNMPCommunity参数，采用 ACL(访问控制列表)保护 SNMP访问权限。\n3)支持命令行管理，文件系统管理，Dual Image；\n4)支持DHCP、FTP、HTTP、ICMP、UDP public、UDP private、TCP public、\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":28},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"29","@psItemId":"1374784141580148736","@itemName":"路由器（2）","@itemStandard":"1)2*Wan口和4*Lan口(支持转Wan口)；\n2)支持console口、telnet(VTY)、SSH、FTP、HTTPS登录。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":29},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"30","@psItemId":"1374784141634674689","@itemName":"★智能机柜（1）","@itemStandard":"1)通过规定不同的深度尺寸将机柜分为 A型和 B型,A型机柜的深度尺寸不包含前门和后门而B型机柜则包含，机柜尺寸详见《招标文件》第五章供货要求-五、技术要求-2.具体参数要求-18）智能机柜-a.款内容；\n2)600（宽）*1000（深）*2000（高）mm。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":30},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"31","@psItemId":"1374784141680812032","@itemName":"智能机柜（2）","@itemStandard":"1)42U 标准 19 英寸智能机柜；\n2)顶部 4 风扇；\n3)供电监测: 供电状态，电压，电流，供电通判，水浸断电，异常报警等功能；\n4)报警: 监测数值超出用户设置的安全参数值时输出报警信号；\n5)PDU：8位10A国标，电源线130cm以上*4。\n投标时提供产品手册或配置清单，证明满足上列技术参数。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":31},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"32","@psItemId":"1374784141718560769","@itemName":"交付要求","@itemStandard":"1)投标人负责陆地及海上单机设备测试、质量维保、调试支持工作。\n2)投标人负责设备及内部配套软件预装及调试技术支持工作。\n3)安装调试时使用的工具、设备由投标人提供。\n4)安装调试的工程进度应根据合同要求确定，投标人根据合同确定的工程进度要求进行施工。\n5)设备安装测试由供货方负责，投标人应提出设备调试的内容、项目、指标和方法，并提供相应的仪器和工具，投标人有责任对需求方的技术人员提出的问题作出解答。调试应进行详细记录，系统调试结束后，由双方技术人员签字后交给需求方验收，系统测试的内容应与技术规范一致。\n6)投标人按照需求方的陆地、建造现场和海上现场安装调试方案，协助需求方开展陆地、建造现场及海上现场安装调试支持工作，单平台出海安装调试次数不低于2次，单次出海调试人员不低于1人。\n7)投标人应提供测试条件，方法和过程的草案，最终测试文件由双方共同拟定。\n8)由于待对接系统的联调时间窗口不一致，被需求方需派专业工程师在建造场地或所在海域随时待命。\n9)海上油气设施生产运营边缘数据中心交付前应完成与现有软件的兼容，实现已有软件的即装即用。投标人提供承诺书（格式自拟或参照招标文件第六章 投标文件构成-第十三款 响应承诺书（格式）），并加盖单位公章。","@isMustQualified":false,"@itemRemark":"","@psItemSequence":32},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"33","@psItemId":"1374784141764698112","@itemName":"★技术培训要求","@itemStandard":"本协议要求提供工程师培训，卖方需提供相关的培训条件。\n本协议下每（台）套设备均涉及3轮调试，包括到货调试、陆地现场调试，海上现场调试；在调试过程中，如出现设备故障或功能失效，需派遣工程师进行调试支持。每阶段调试不高于3次，单次调试时间不高于14天，海上现场调试人员不得多于3名（即通常情况派出单人即可完成全部调试工作，1：1冗余配置人员应对海上现场突发情况）；项目并发时投标人可投入足够人员进行调试，供应商应提供拟派出调试人员信息并承诺满足调试要求。\n培训时间、地点和语言：技术方案所述设备制造商或集成商对设备使用单位的人员进行操作和维修培训，培训效果应达到相关人员能够独立操作，培训时间应不少于7个工作日。培训内容为设备基础知识（组成、原理等）；设备的操作方法及注意事项；设备调试和故障诊断；日常维护和保养等。投标人提供承诺书（格式自拟或参照招标文件第六章 投标文件构成-第十三款 响应承诺书（格式）），并加盖单位公章。","@isMustQualified":true,"@itemRemark":"","@psItemSequence":33},{"tbComponentIds":[],"psLists":[],"@itemSequenceNumber":"34","@psItemId":"1374784141806641153","@itemName":"★一般指标偏离要求","@itemStandard":"除了以上加星号的响应性条款外，招标文件中的其他响应性条款（含合同条款）均为一般响应性条款偏离超过3项，视为响应性评议不合格","@isMustQualified":true,"@itemRemark":"","@psItemSequence":34}],"@psFlowSequence":4,"@psFlowId":183602665574684847,"@psFlowName":"响应性评审标准","@isSecretBid":false,"@kbStageSequence":1,"@psMethod":1,"@onlineNegotiation":false,"@secondQuote":false,"@descriptionBid":false,"@summaryType":1,"@submitType":1,"@passLimitType":0,"@orderType":1,"summaryRule": <script type="text/javascript">
    /*目前分项报价表html展示有三种情况：
    1.在系统中使用：需要父界面传递过来的token和域名去获取在线excel路径
    2.在投标编制工具客户端中使用：使用路径加参数区分，按钮添加id让投标编制工具捕获点击事件进行下载
    3.直接预览html：不展示下载按钮，仅有提示文本
    4.在在线投标编制中使用（没有登录）：要与签名服务对接进行下载
    */
    // 获取登录相关的系统传递的token和访问接口的域名
    var access_token = (window.parent.sessionStorage && window.parent.sessionStorage.access_token) || ''
    var httpRequestUrl = window.parent.location.origin || ''
    // 获取地址栏参数区分是不是投标编制使用
    var referrer = getUrlParams().referrer
    function getUrlParams() {
      let url = window.location.search; //获取url中"?"符后的字串
      let paramsObj = new Object();
      if (url.indexOf("?") != -1) {
        let str = url.substr(1);
        strs = str.split("&");
        for (let i = 0; i < strs.length; i++) {
          paramsObj[strs[i].split("=")[0]] = decodeURI(strs[i].split("=")[1]);
        }
      }
      return paramsObj
    }
    //下载文件并重命名
    function downloadFileRename(url, filename) {
      var xhr = new XMLHttpRequest()
      xhr.open('GET', url, true)
      xhr.responseType = 'blob'
      xhr.onload = function() {
        if (xhr.status === 200) {
          var blob = xhr.response
          if (window.navigator.msSaveOrOpenBlob) {
            navigator.msSaveBlob(blob, filename)
          } else {
            var link = document.createElement('a')
            link.href = window.URL.createObjectURL(blob)
            link.download = filename
            // fix Firefox
            link.style.display = 'none'
            document.body.appendChild(link)
            link.click()
            document.body.removeChild(link)
            window.URL.revokeObjectURL(link.href)
          }
        }
      }
      xhr.send()
    }

            i = 1;
        }

        }
        return pre;

        // // tab左右滑动事件
        function moveSlow(distance, total, step, LOR, instance) {
            // 正向滚动 和 反向滚动
            if (LOR) {
                // 每隔1毫秒移动一小段距离，直到移动至目标至为止，反之亦然
                if (distance < total) {
                    distance += step;
                    instance.scrollLeft(distance)
                    setTimeout(function() {
                        moveSlow(distance, total, step, true, instance);
                    }, 1);
                } else {
                    instance.scrollLeft(total)
                }
            } else if (!LOR) {
                if (distance > total) {
                    distance -= step;
                    instance.scrollLeft(distance)
                    setTimeout(function() {
                        moveSlow(distance, total, step, false, instance);
                    }, 1);
                } else {
                    instance.scrollLeft(total)
                }
            }
        }
        // // 交互事件订阅
        function subscribeEvet() {
            // 大卡片点击
            $('.card-item').on('click', function (e) {
                var index = $('.card-this').attr('data-index')
                var currIndex = $(this).attr('data-index')
                if (index === currIndex) {
                    return
                }
                $('.card-item').removeClass('card-this')
                this.className = 'card-item card-this'
                $('.card-con').css('display', 'none')
                $(".card-con:eq(" + currIndex + ")").css('display', 'block')
                $(".card-con:eq(" + currIndex + ")").children('.bid-file-detail-box-content').children('.var-box:first').css('display', 'block')
                $(".card-con:eq(" + currIndex + ")").children('.nav-box').children('.bid-file-tab').children('.file-item:first').addClass('file-this')
                $(".card-con:eq(" + currIndex + ")").children('.bid-file-box-content').children('.zl-file-table-box:first').css('display', 'block')
                $(".card-con:eq(" + currIndex + ")").children('.nav-box').children('.bid-psmethods-tab').children('.psmethods-item:first').addClass('file-this')
                $(".card-con:eq(" + currIndex + ")").children('.bid-ps-detail-box-content').children('.var-box-ps:first').css('display', 'block')
                $(".card-con:eq(" + currIndex + ")").children('.bid-psmethods-box-content').children('.zl-psmethod-box:first').css('display', 'block')
            })
            $('.nav-right').on('click', function () {
                var instance = $(this).prev()
                var distance = instance.scrollLeft()
                var scrollNum = distance + 200;
                var step = (distance - scrollNum) / 50;
                if (step < 0) {
                    step = -step;
                }
                moveSlow(distance, scrollNum, step, true, instance);
            })
            $('.nav-left').on('click', function () {
                var instance = $(this).next()
                var distance = instance.scrollLeft()
                var scrollNum = distance - 200;
                if (scrollNum < 0) {
                    scrollNum = 0;
                }
                var step = (distance - scrollNum) / 50;
                if (step < 0) {
                    step = -step;
                }
                moveSlow(distance, scrollNum, step, false, instance);
            })
            $('.file-item').on('click', function (e) {
                $('.file-item').removeClass('file-this')
                this.className = 'file-item file-this'
                $('.zl-file-table-box').css('display', 'none')
                $('.var-box').css('display', 'none')
                var currIndex = $(this).attr('data-index')
                $(".zl-file-table-box:eq(" + currIndex + ")").css('display', 'block')
                $(".var-box:eq(" + currIndex + ")").css('display', 'block')
                setIeStyle()
            })
            $('.psmethods-item').on('click', function (e) {
                $('.psmethods-item').removeClass('file-this')
                this.className = 'psmethods-item file-this'
                $('.zl-psmethod-box').css('display', 'none')
                var currIndex = $(this).attr('data-index')
                $(".zl-psmethod-box:eq(" + currIndex + ")").css('display', 'block')
                $('.var-box-ps').css('display', 'none')
                $(".var-box-ps:eq(" + currIndex + ")").css('display', 'block')
                setIeStyle()
            })
            // 点击下载分项报价表模块的"查看详细内容"按钮
            $('.downLoadFxbjExcel-byHttp').on('click', function (event) {
              // 请求后端获取分项报价表的文件路径
              var ajaxData = {
                // bdId: $(this).attr('data-bdId') || '',
                tbwjComponentTabId: $(this).attr('data-tbPartFileId') || ''
              }
              // 默认名称
              var componentName = $(this).attr('data-componentName') || '分项报价表文件'
              $.ajax({
                url: httpRequestUrl + '/api/saas-template/common/api/tbwjComponent/getExcelFile',
                type: 'post',
                data: JSON.stringify(ajaxData),
                contentType: "application/json",
                headers: {
                  "Authorization": 'Bearer ' + access_token
                },
                success: function (res) {
                  if (res.success) {
                    // 下载文件并且重命名
                    if (res.data && res.data.downLoadUrl) {
                      // 截取后缀生成文件名
                      if (res.data.fileName && res.data.fileName.indexOf(".") !== -1) {
                        componentName = componentName + '.' + res.data.fileName.split(".")[1]
                      } else {
                        componentName = componentName + '.xlsx'
                      }
                      downloadFileRename(res.data.downLoadUrl, componentName)
                    } else {
                      alert('获取文件异常！')
                    }
                  } else {
                    alert(res.errMessage||'接口响应异常！')
                  }
                },
                error: function (error) {
                  alert('接口请求异常！')
                }
              })
            })
        }
        function setIeStyle() {
            if(isIE()) {
                $('.file-item').css({ 'color': '#1F2329', "background-color": '#F2F3F5' })
                $('.psmethods-item').css({ 'color': '#1F2329', "background-color": '#F2F3F5' })

                })
                $('.nav-left').hover(function () {
                    $('.nav-left').css({ 'background-color': lightColorMap[color + '-theme'] })
                })
                $('.background-color-theme').css({
                  'background-color': defaultColorMap[color + '-theme']
                })
            }
        }
        // 顺序不能乱
        createProjectDom()
        creatBidTab()
        createBidInfoDom()
        createBidDetailDom()
        createBidFileTab()
        createBidPsMethodTab()
